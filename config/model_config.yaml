# ==============================================================================
# NBA Betting Intelligence — Model & Risk Configuration (single source of truth)
# Loaded by src/config.py. Values are validated at load time (out-of-range values fail fast).
#
# Honesty notes:
# - The EWMA rates below are UNTUNED structural priors. The previous "Optuna-optimized" values
#   (0.020 / 0.155 / 0.035 / 0.080) were selected by an objective that leaked final scores and
#   are invalid. Re-tune only with scripts/run_optuna_study.py (validation + untouched holdout).
# - None of these parameters has been validated against historical Pinnacle closing lines:
#   the project does not yet store historical closing odds.
# ==============================================================================

model:
  version_id: "model_f_ensemble_v8"
  ewma_alpha_slow: 0.045
  ewma_alpha_fast: 0.110
  tempo_alpha_slow: 0.055
  tempo_alpha_fast: 0.130
  market_anchor_model_weight: 0.30   # p_final = 0.30 * p_model + 0.70 * p_market (de-vigged)
  max_model_market_disagreement: 0.15 # Maximum allowable spread between model and sharp market consensus

risk_management:                     # AGENTS.md section 2 (paper_trading_manager) — owner decision 2026-11-09
  virtual_bankroll_initial_pen: 100.00
  # High-conviction staking: the stake grows with the model's calibrated, market-anchored win probability
  # for a given price (half Kelly). It is 0 when EV <= threshold and is never rounded up to a floor.
  staking_mode: "fractional_kelly"   # "fractional_kelly" | "flat"
  kelly_fraction: 0.50               # half Kelly
  min_stake_pen: 1.00                # smaller Kelly stakes are skipped
  max_stake_pen: 10.00               # hard cap per selection
  max_stake_bankroll_fraction: 0.10  # hard cap per selection as % of bankroll
  base_stake_pen: 1.00               # only used when staking_mode = "flat"
  max_selections_per_matchday: 3
  min_ev_threshold: 0.05             # EV > 5%
  max_portfolio_exposure_pct: 0.30
  # Combined bets and player props are paper-traded in their own ledger (player_prop_picks).
  # No bookmaker prop/SGP prices are captured, so their lines and prices are ESTIMATES and every pick is
  # labelled as such; they are never mixed into the observed-odds metrics.
  allow_parlays: false
  allow_player_props_betting: false

  # V8 Phase 1: Contextual Staking Conviction Tiers (Single source of truth)
  conviction_tiers:
    aggressive:
      tier_low:
        prob_floor: 0.35
        prob_ceil: 0.50
        base: 3.50
        slope: 2.00
        kelly_cap: 2.00
        kelly_multiplier: 4.0
      tier_mid:
        prob_floor: 0.50
        prob_ceil: 0.58
        base: 6.00
        slope: 3.50
        kelly_cap: 3.00
        kelly_multiplier: 6.0
      tier_high:
        prob_floor: 0.58
        prob_ceil: 0.65
        base: 10.00
        slope: 4.50
        kelly_cap: 4.50
        kelly_multiplier: 8.0
      tier_star:
        prob_floor: 0.65
        prob_ceil: 1.00
        base: 15.00
        slope: 5.00
        kelly_cap: 5.00
        kelly_multiplier: 10.0
      edge_modulator_floor: 0.40
      edge_modulator_div: 0.06
      min_stake_floor: 2.50
      max_longshot_odds: 4.00
      max_longshot_stake: 6.00
    conservative:
      tier_low:
        prob_floor: 0.35
        prob_ceil: 0.50
        base: 1.00
        slope: 0.55
        kelly_cap: 0.25
        kelly_multiplier: 1.2
      tier_mid:
        prob_floor: 0.50
        prob_ceil: 0.58
        base: 2.00
        slope: 0.95
        kelly_cap: 0.35
        kelly_multiplier: 1.5
      tier_high:
        prob_floor: 0.58
        prob_ceil: 0.65
        base: 3.50
        slope: 0.95
        kelly_cap: 0.40
        kelly_multiplier: 1.8
      tier_star:
        prob_floor: 0.65
        prob_ceil: 1.00
        base: 4.80
        slope: 0.85
        kelly_cap: 0.45
        kelly_multiplier: 2.0
      edge_modulator_floor: 0.20
      edge_modulator_div: 0.08
      min_stake_floor: 1.00
      max_longshot_odds: 2.50
      max_longshot_stake: 1.65

  # Overtime Risk Guard
  overtime_guard:
    enabled: true
    min_overtime_prob: 0.068
    under_haircut: 0.85

  # Closing Line Value (CLV) Governor
  clv_governor:
    enabled: true
    lookback_bets: 25
    min_sample_size: 4
    severe_negative_threshold: -2.0
    severe_negative_factor: 0.50
    moderate_negative_threshold: 0.0
    moderate_negative_factor: 0.75
    positive_alpha_threshold: 2.0
    positive_alpha_factor: 1.10
    neutral_factor: 1.00

  # Conformal Uncertainty & Steam Modulators
  risk_modulators:
    high_uncertainty_std: 0.08
    high_uncertainty_factor: 0.85
    low_uncertainty_std: 0.045
    low_uncertainty_factor: 1.10
    narrow_conformal_width: 0.035
    narrow_conformal_factor: 1.06
    wide_conformal_width: 0.080
    wide_conformal_factor: 0.88
    ev_lower_bound_boost_factor: 1.05
    sharp_steam_delta: 0.020
    sharp_steam_factor: 1.08
    adverse_steam_delta: -0.020
    adverse_steam_factor: 0.85

sources:
  betting_allowed_source_types: ["OBSERVED"]

sub_bankroll_combinadas:             # Sub-bankroll independiente para SGP y combinadas de alta probabilidad
  enabled: true
  virtual_bankroll_initial_pen: 50.00
  staking_mode: "dynamic_kelly"
  kelly_fraction: 0.40
  min_stake_pen: 0.50
  max_stake_pen: 5.00
  max_stake_bankroll_fraction: 0.10
  max_parlays_per_matchday: 2
  min_compound_ev_pct: 6.0

hybrid_allocation:                   # Política de asignación 70% Totales / 30% Moneyline
  enabled: true
  totals_weight: 0.70
  moneyline_weight: 0.30
  max_totals_per_matchday: 2
  max_moneyline_per_matchday: 1

clv_meta_labeling:                   # V8 Phase 3: Calibración empírica CLV Meta-Labeling
  enabled: false
  calibrated_weights_path: "config/calibrated_weights.json"
  intercept: -0.2085
  coef_steam_delta: 57.7103
  coef_conformal_width_excess: -2.1211
  coef_disagreement_excess: -0.1816
  coef_overround_excess: -0.0556
  time_decay_rate: 0.04
  max_hours_to_tipoff: 12.0
  adverse_steam_threshold: -0.040
  min_p_clv_threshold: 0.48

copula_correlations:                 # V8 Phase 3: Correlaciones empíricas SGP / Cópulas Vine
  enabled: true
  calibrated_weights_path: "config/calibrated_weights.json"

situational_factors:                 # V8 Phase 4: Factores situacionales de descanso, viaje y altitud
  home_court_advantage_elo: 50.0
  home_court_advantage_pts: 1.85
  b2b_penalty_away: -2.10
  b2b_penalty_home: -1.60
  rest_3plus_bonus_away: 0.20
  rest_3plus_bonus_home: 0.30
  altitude_edge_multiplier: 1.35
  altitude_threshold_feet: 4000.0
  altitude_divisor_feet: 4200.0
  travel_miles_rate: 0.22
  timezone_rate: 0.12

lineup_synergy:                      # V8 Phase 4: Reglas y umbrales de penalización compuesta de rotación
  initiator_absence_threshold: 1.25
  initiator_absence_penalty: 0.32
  rim_anchor_absence_threshold: 1.40
  rim_anchor_absence_penalty: 0.35
  two_way_wing_penalty: 0.22
  compound_absence_penalty: 0.14
