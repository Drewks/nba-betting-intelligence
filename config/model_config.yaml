# ==============================================================================
# NBA Betting Intelligence — Model & Risk Configuration (single source of truth)
# Loaded by src/config.py. Values are validated at load time (out-of-range values fail fast).
#
# Honesty notes:
# - The EWMA rates below are UNTUNED structural priors. The previous "Optuna-optimized" values
#   (0.020 / 0.155 / 0.035 / 0.080) were selected by an objective that leaked final scores and
#   are invalid. Re-tune only with scripts/run_optuna_study.py (validation + untouched holdout).
# - None of these parameters has been validated against historical Pinnacle closing lines:
#   the project does not yet store historical closing odds.
# ==============================================================================

model:
  version_id: "model_f_ensemble_v8"
  ewma_alpha_slow: 0.045
  ewma_alpha_fast: 0.110
  tempo_alpha_slow: 0.055
  tempo_alpha_fast: 0.130
  market_anchor_model_weight: 0.30   # p_final = 0.30 * p_model + 0.70 * p_market (de-vigged)

risk_management:                     # AGENTS.md section 4 (paper_trading_manager), version 1 rules
  virtual_bankroll_initial_pen: 100.00
  base_stake_pen: 1.00               # Stake base S/1.00
  max_stake_pen: 1.00                # Stake maximo S/1.00 por seleccion
  max_selections_per_matchday: 3
  min_ev_threshold: 0.05             # EV > 5%
  max_portfolio_exposure_pct: 0.20
  allow_parlays: false               # Prohibidas apuestas combinadas
  allow_player_props_betting: false  # No observed player-prop prices are ingested yet

sources:
  betting_allowed_source_types: ["OBSERVED"]
