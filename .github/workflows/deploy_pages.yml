name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "reports/dashboard.html"
      - ".github/workflows/deploy_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Asegurar existencia de index.html
        run: |
          mkdir -p docs
          if [ -f "reports/dashboard.html" ] && [ ! -f "docs/index.html" ]; then
            cp reports/dashboard.html docs/index.html
          fi

      - name: 3. Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: 4. Subir artefacto web de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: 5. Desplegar sitio web institucional
        id: deployment
        uses: actions/deploy-pages@v4
