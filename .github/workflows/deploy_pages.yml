name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "reports/dashboard.html"
      - ".github/workflows/deploy_pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Asegurar existencia de index.html y .nojekyll
        run: |
          mkdir -p docs
          if [ -f "reports/dashboard.html" ] && [ ! -f "docs/index.html" ]; then
            cp reports/dashboard.html docs/index.html
          fi
          touch docs/.nojekyll

      - name: 3. Publicar en rama gh-pages (Compatible con Deploy from a branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: false

      - name: 4. Configurar GitHub Pages (Compatible con GitHub Actions source)
        id: pages_config
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: 5. Subir artefacto web de Pages
        if: steps.pages_config.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: 'docs/'

      - name: 6. Desplegar mediante GitHub Actions
        if: steps.pages_config.outcome == 'success'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
