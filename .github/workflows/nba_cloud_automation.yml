name: NBA Betting Intelligence — Cloud Auto-Trading & Calibration (S/100 Virtual)

on:
  schedule:
    # 1. Post-Partido + Liquidación + Auto-Calibración (Adelantado para compensar cola de GitHub Actions):
    # 06:17 UTC (01:17 AM Perú) -> Ejecuta ~08:30-10:00 UTC con cola típica
    - cron: "17 6 * * *"
    # 1b. Respaldo Matutino Liquidación: 10:47 UTC (05:47 AM Perú)
    - cron: "47 10 * * *"
    # 2. Pre-Partido Principal (Line Shopping 32 casas + Pronósticos tempranos):
    # 17:23 UTC (12:23 PM Perú) -> Ejecuta ~19:50-20:30 UTC antes de los partidos
    - cron: "23 17 * * *"
    # 3. Cierre Pre-Tipoff Ola 1 (Partidos 00:00 UTC / 7:00 PM EST):
    # 20:41 UTC (03:41 PM Perú) -> Ejecuta ~23:15-23:45 UTC (CLV exacto 15-45m pre-tipoff)
    - cron: "41 20 * * *"
    # 4. Cierre Pre-Tipoff Ola 2 (Partidos 01:00 - 01:30 UTC):
    # 22:47 UTC (05:47 PM Perú) -> Ejecuta ~01:10-01:35 UTC
    - cron: "47 22 * * *"
    # 5. Cierre Pre-Tipoff Ola 3 (Partidos Costa Oeste 03:00 - 03:30 UTC):
    # 00:37 UTC (07:37 PM Perú) -> Ejecuta ~02:35-02:45 UTC
    - cron: "37 0 * * *"
  workflow_dispatch:
    inputs:
      cycle_mode:
        description: "Modo de ciclo a ejecutar (auto, pregame, settle_and_calibrate, sniper)"
        required: false
        default: "auto"

permissions:
  contents: write
  issues: write

jobs:
  run-nba-intelligence-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 1. Clonar repositorio con historial SQLite y Vault Obsidian (Nativo sin Node.js)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin main
          git checkout -B main origin/main

      - name: 2. Instalar uv y configurar Python 3.12 (Nativo sin Node.js)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 3. Instalar dependencias del proyecto y motor Chromium para Playwright
        run: |
          uv sync --extra dev --python 3.12
          uv run playwright install chromium

      - name: 4. Ejecutar suite de pruebas de integridad y anti-leakage
        run: uv run pytest

      - name: 5. Ejecutar Ciclo Stateful y Evaluar Alerta de Madurez para Entorno Real
        env:
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SIMULATION_ONLY: "true"
        run: |
          CYCLE_MODE="${{ github.event.inputs.cycle_mode }}"
          if [ -z "$CYCLE_MODE" ] || [ "$CYCLE_MODE" = "auto" ]; then
            SCHEDULE="${{ github.event.schedule }}"
            if [ "$SCHEDULE" = "17 6 * * *" ] || [ "$SCHEDULE" = "47 10 * * *" ]; then
              CYCLE_MODE="settle_and_calibrate"
            elif [ "$SCHEDULE" = "23 17 * * *" ] || [ "$SCHEDULE" = "41 20 * * *" ] || [ "$SCHEDULE" = "47 22 * * *" ] || [ "$SCHEDULE" = "37 0 * * *" ]; then
              CYCLE_MODE="pregame"
            else
              CYCLE_MODE="auto"
            fi
          fi
          echo "Ejecutando ciclo en modo: $CYCLE_MODE (schedule: ${{ github.event.schedule || 'manual' }})"
          uv run python scripts/run_cloud_cycle.py --mode "$CYCLE_MODE"

      - name: 5b. Ejecutar Monitor Dual-Window Injury Sniper (T-2h y T-30m)
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
        run: |
          uv run python scripts/run_injury_sniper.py --mode auto

      - name: 6. Publicar Tablero de Pronósticos, Semáforo y Auditoría en el Summary de GitHub Actions
        run: |
          cat SEGUIMIENTO_APUESTAS.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat reports/daily_report.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat reports/audit_report.md >> $GITHUB_STEP_SUMMARY

      - name: 7. Guardar estado (SQLite, CSV, Alerta de Madurez, Reportes y Vault Obsidian)
        run: |
          git config user.name "nba-intelligence-bot"
          git config user.email "nba-intelligence-bot@users.noreply.github.com"
          git add -f SEGUIMIENTO_APUESTAS.md data/apuestas_historial.csv data/readiness_status.json data/visual_rag/latest_visual_context.json data/nba_intelligence.sqlite3 data/evaluation/latest_run_summary.json reports/*.md reports/dashboard.html NBA/
          if git diff --staged --quiet; then
            echo "Sin cambios nuevos para confirmar."
          else
            git commit -m "chore(auto-cycle): actualización cloud de paper trading S/100, liquidación y auto-calibración [skip ci]"
            git push origin main
          fi
