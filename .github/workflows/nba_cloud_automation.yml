name: NBA Betting Intelligence — Cloud Auto-Trading & Calibration (S/100 Virtual)

on:
  schedule:
    # 1. Post-Partido + Liquidación + Auto-Calibración: 11:23 UTC (06:23 AM Hora Perú — fuera de hora punta :00)
    - cron: "23 11 * * *"
    # 2. Pre-Partido Principal (Line Shopping 32 casas + Pronósticos): 21:37 UTC (04:37 PM Hora Perú)
    - cron: "37 21 * * *"
    # 3. Cierre Pre-Tipoff (Captura de Closing Line Value CLV + Costa Oeste): 23:43 UTC (06:43 PM Hora Perú)
    - cron: "43 23 * * *"
  workflow_dispatch:
    inputs:
      cycle_mode:
        description: "Modo de ciclo a ejecutar (auto, pregame, settle_and_calibrate)"
        required: false
        default: "auto"

permissions:
  contents: write
  issues: write

jobs:
  run-nba-intelligence-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 1. Clonar repositorio con historial SQLite y Vault Obsidian (Nativo sin Node.js)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin main
          git checkout -B main origin/main

      - name: 2. Instalar uv y configurar Python 3.12 (Nativo sin Node.js)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 3. Instalar dependencias del proyecto
        run: uv sync --extra dev --python 3.12

      - name: 4. Ejecutar suite de pruebas de integridad y anti-leakage
        run: uv run pytest

      - name: 5. Ejecutar Ciclo Stateful y Evaluar Alerta de Madurez para Entorno Real
        env:
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SIMULATION_ONLY: "true"
        run: |
          uv run python scripts/run_cloud_cycle.py --mode "${{ github.event.inputs.cycle_mode || 'auto' }}"

      - name: 6. Publicar Tablero de Pronósticos y Semáforo en el Summary de GitHub Actions
        run: |
          cat SEGUIMIENTO_APUESTAS.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat reports/daily_report.md >> $GITHUB_STEP_SUMMARY

      - name: 7. Guardar estado (SQLite, CSV, Alerta de Madurez, Reportes y Vault Obsidian)
        run: |
          git config user.name "nba-intelligence-bot"
          git config user.email "nba-intelligence-bot@users.noreply.github.com"
          git add -f SEGUIMIENTO_APUESTAS.md data/apuestas_historial.csv data/readiness_status.json data/nba_intelligence.sqlite3 data/evaluation/latest_run_summary.json reports/*.md NBA/
          if git diff --staged --quiet; then
            echo "Sin cambios nuevos para confirmar."
          else
            git commit -m "chore(auto-cycle): actualización cloud de paper trading S/100, liquidación y auto-calibración [skip ci]"
            git push origin main
          fi
