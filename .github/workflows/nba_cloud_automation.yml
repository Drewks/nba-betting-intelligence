name: NBA Betting Intelligence — Cloud Auto-Trading & Calibration (S/100 Virtual)

on:
  schedule:
    # 1. Apertura de Mercado (Line Shopping 32 casas + Player Props + RETAbet SGPs):
    # 15:15 UTC -> 10:15 AM Perú
    - cron: "15 15 * * *"
    # 2. Injury Sniper T-2H (Reporte oficial de bajas NBA + Líneas desfasadas retail):
    # 22:15 UTC -> 05:15 PM Perú
    - cron: "15 22 * * *"
    # 3. Cierre Pre-Tipoff T-25m Ola 1 (Quintetos confirmados + Stale Lines + Surebets):
    # 23:35 UTC -> 06:35 PM Perú
    - cron: "35 23 * * *"
    # 4. Liquidación Nocturna Oficial ESPN + Reconciliación CPPI S/100 + Resumen Diario Telegram:
    # 06:45 UTC -> 01:45 AM Perú
    - cron: "45 6 * * *"
  workflow_dispatch:
    inputs:
      cycle_mode:
        description: "Modo de ciclo a ejecutar (auto, morning, sniper, settle, all)"
        required: false
        default: "auto"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: nba-pipeline-execution
  cancel-in-progress: false

jobs:
  run-nba-intelligence-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 1. Clonar repositorio con historial SQLite y Vault Obsidian (Nativo sin Node.js)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin main
          git checkout -B main origin/main

      - name: 2. Instalar uv y configurar Python 3.12 (Nativo sin Node.js)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 3. Instalar dependencias del proyecto y motor Chromium para Playwright
        run: |
          uv sync --extra dev --python 3.12
          uv run playwright install chromium

      - name: 4. Ejecutar suite de pruebas de integridad y anti-leakage
        run: uv run pytest

      - name: 5. Ejecutar Ciclo de Inteligencia, Modelos y Despacho a Telegram
        env:
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SIMULATION_ONLY: "true"
        run: |
          CYCLE_MODE="${{ github.event.inputs.cycle_mode }}"
          SCHEDULE="${{ github.event.schedule }}"
          echo "Disparador: schedule='$SCHEDULE' | input='$CYCLE_MODE'"

          if [ "$CYCLE_MODE" = "settle" ] || [ "$SCHEDULE" = "45 6 * * *" ]; then
            echo "🌙 [VENTANA NOCTURNA 01:45 AM PET] Liquidación oficial ESPN, Reconciliación CPPI y Resumen Diario Telegram"
            uv run python scripts/run_automated_scheduler.py --run-now settle
          elif [ "$CYCLE_MODE" = "morning" ] || [ "$SCHEDULE" = "15 15 * * *" ]; then
            echo "☀️ [VENTANA MATUTINA 10:15 AM PET] Apertura de Mercado, Player Props, RETAbet SGPs y Alertas Telegram"
            uv run python scripts/run_automated_scheduler.py --run-now morning
          elif [ "$CYCLE_MODE" = "sniper" ] || [ "$SCHEDULE" = "15 22 * * *" ] || [ "$SCHEDULE" = "35 23 * * *" ]; then
            echo "🎯 [VENTANA INJURY SNIPER & CUOTAS PERÚ] Bajas T-2h/T-30m y Stale Lines / Surebets"
            uv run python scripts/run_automated_scheduler.py --run-now sniper
            uv run python scripts/run_live_odds_monitor.py --once
          else
            echo "🚀 [MODO MANUAL / COMPLETO] Ejecutando apertura matutina y escaneo de cuotas"
            uv run python scripts/run_automated_scheduler.py --run-now morning
            uv run python scripts/run_live_odds_monitor.py --once
          fi

      - name: 6. Publicar Tablero de Pronósticos, Semáforo y Auditoría en el Summary de GitHub Actions
        run: |
          cat SEGUIMIENTO_APUESTAS.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat reports/daily_report.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat reports/audit_report.md >> $GITHUB_STEP_SUMMARY

      - name: 7. Guardar estado (SQLite, CSV, Alerta de Madurez, Reportes, Evaluación y Vault Obsidian)
        run: |
          git config user.name "nba-intelligence-bot"
          git config user.email "nba-intelligence-bot@users.noreply.github.com"
          git add -f SEGUIMIENTO_APUESTAS.md data/apuestas_historial.csv data/readiness_status.json data/visual_rag/latest_visual_context.json data/nba_intelligence.sqlite3 data/evaluation/*.json reports/*.md reports/dashboard.html docs/index.html NBA/
          if git diff --staged --quiet; then
            echo "Sin cambios nuevos para confirmar."
          else
            git commit -m "chore(auto-cycle): actualización cloud de paper trading S/100, liquidación y auto-calibración [skip ci]"
            git push origin main
          fi

      - name: 7b. Sincronizar rama gh-pages con el nuevo dashboard
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: false

  deploy-pages:
    needs: run-nba-intelligence-cycle
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 1b. Asegurar existencia de docs/index.html y .nojekyll
        run: |
          mkdir -p docs
          if [ -f "reports/dashboard.html" ]; then
            cp reports/dashboard.html docs/index.html
          fi
          touch docs/.nojekyll

      - name: 2. Configurar entorno de GitHub Pages
        uses: actions/configure-pages@v5

      - name: 3. Subir artefacto web de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: 4. Desplegar en vivo en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
