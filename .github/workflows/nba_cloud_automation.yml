name: NBA Betting Intelligence — Cloud Auto-Trading & Calibration (S/100 Virtual)

on:
  schedule:
    # 1. Ejecución Post-Partido + Liquidación + Auto-Calibración: 11:00 UTC (06:00 AM Hora Perú)
    - cron: "0 11 * * *"
    # 2. Ejecución Pre-Partido (Captura de cuotas y emisión de pronósticos): 22:00 UTC (05:00 PM Hora Perú)
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      cycle_mode:
        description: "Modo de ciclo a ejecutar (auto, pregame, settle_and_calibrate)"
        required: false
        default: "auto"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run-nba-intelligence-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 1. Checkout repositorio (con historial SQLite y Vault Obsidian)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Instalar uv y configurar Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: "3.12"

      - name: 3. Instalar dependencias del proyecto
        run: uv sync --extra dev --python 3.12

      - name: 4. Ejecutar suite de pruebas de integridad y anti-leakage (16 tests)
        run: uv run pytest

      - name: 5. Ejecutar Ciclo Stateful (Ingestión -> Liquidación -> Auto-Calibración -> Predicción)
        env:
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          SIMULATION_ONLY: "true"
        run: |
          uv run python scripts/run_cloud_cycle.py --mode "${{ github.event.inputs.cycle_mode || 'auto' }}"

      - name: 6. Publicar Tablero de Pronósticos y Bankroll en el Summary de GitHub Actions
        run: |
          cat reports/daily_report.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat reports/weekly_report.md >> $GITHUB_STEP_SUMMARY

      - name: 7. Guardar estado (SQLite, Reportes y Vault Obsidian) en el repositorio
        run: |
          git config user.name "nba-intelligence-bot"
          git config user.email "nba-intelligence-bot@users.noreply.github.com"
          git add -f data/nba_intelligence.sqlite3 data/evaluation/latest_run_summary.json reports/*.md NBA/
          if git diff --staged --quiet; then
            echo "Sin cambios nuevos para confirmar."
          else
            git commit -m "chore(auto-cycle): actualización cloud de paper trading S/100, liquidación y auto-calibración [skip ci]"
            git push
          fi
